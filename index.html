/*
=========================================================
INITIALIZE LOCAL STORAGE
=========================================================
*/

/*
IMPORTANT:

We DON'T delete your existing data.

If data already exists, we use it.

If data doesn't exist, default data is created.
*/


if (!localStorage.getItem("ks7_categories")) {

    localStorage.setItem(
        "ks7_categories",
        JSON.stringify(defaultCategories)
    );

}



if (!localStorage.getItem("ks7_products")) {

    localStorage.setItem(
        "ks7_products",
        JSON.stringify(defaultProducts)
    );

}



/*
=========================================================
LOAD DATA
=========================================================
*/

let categories = [];

let products = [];

let cart = [];

let activeCategory = "All";

let payment = "Cash";



/*
=========================================================
SAFE LOAD FUNCTION
=========================================================
*/

function loadData() {


    try {

        categories =
            JSON.parse(
                localStorage.getItem("ks7_categories")
            ) || [];


    } catch (error) {

        categories = [];

    }



    try {

        products =
            JSON.parse(
                localStorage.getItem("ks7_products")
            ) || [];


    } catch (error) {

        products = [];

    }

}



loadData();



/*
=========================================================
MONEY FORMAT
=========================================================
*/

function money(number) {

    number = Number(number) || 0;

    return "$" + number.toFixed(2);

}



/*
=========================================================
GET PRODUCT NAME
=========================================================
*/

/*
This is the important fix.

It supports:

product.name

AND

product.productName
*/

function getProductName(product) {

    if (!product) {

        return "Unknown Product";

    }


    return (
        product.name
        ||
        product.productName
        ||
        "Unknown Product"
    );

}



/*
=========================================================
GET PRODUCT PRICE
=========================================================
*/

function getProductPrice(product) {

    if (!product) {

        return 0;

    }


    return Number(
        product.price
        ||
        product.productPrice
        ||
        0
    );

}



/*
=========================================================
GET PRODUCT STOCK
=========================================================
*/

function getProductStock(product) {

    if (!product) {

        return 0;

    }


    return Number(
        product.stock
        ||
        product.quantity
        ||
        0
    );

}



/*
=========================================================
RENDER CATEGORIES
=========================================================
*/

function renderCategories() {


    /*
    DROPDOWN
    */

    $("#categoryFilter").html(

        `<option value="All">

            All Categories

        </option>`

        +

        categories.map(function (category) {

            return `

                <option value="${category.name}">

                    ${category.name}

                </option>

            `;

        }).join("")

    );



    $("#categoryFilter").val(
        activeCategory
    );



    /*
    CATEGORY BUTTONS
    */

    let html = `

        <button

            data-cat="All"

            class="cat-btn rounded-xl border p-3 text-left transition
            ${activeCategory === "All"
                ? "border-blue-600 bg-blue-600 text-white shadow"
                : "bg-white hover:border-blue-500"}">

            <span class="text-2xl">

                ▦

            </span>


            <div class="font-semibold">

                All Menu

            </div>


            <div
                class="text-xs ${
                    activeCategory === "All"
                    ? "text-blue-100"
                    : "text-slate-400"
                }">

                ${products.length} items

            </div>

        </button>

    `;



    /*
    OTHER CATEGORIES
    */

    categories.forEach(function (category) {


        let count =
            products.filter(function (product) {

                return (
                    product.category
                    ===
                    category.name
                );

            }).length;



        html += `

            <button

                data-cat="${category.name}"

                class="cat-btn rounded-xl border p-3 text-left transition
                ${activeCategory === category.name
                    ? "border-blue-600 bg-blue-600 text-white shadow"
                    : "bg-white hover:border-blue-500"}">

                <span class="text-2xl">

                    ${category.icon || "📁"}

                </span>


                <div class="font-semibold">

                    ${category.name}

                </div>


                <div
                    class="text-xs ${
                        activeCategory === category.name
                        ? "text-blue-100"
                        : "text-slate-400"
                    }">

                    ${count} items

                </div>

            </button>

        `;


    });



    $("#categoryButtons").html(
        html
    );

}



/*
=========================================================
RENDER PRODUCTS
=========================================================
*/

function renderProducts() {


    let search =
        $("#searchProduct")
            .val()
            .trim()
            .toLowerCase();



    let list =
        products.filter(function (product) {


            let productName =
                getProductName(product)
                    .toLowerCase();



            let categoryMatch =
                (
                    activeCategory === "All"
                    ||
                    product.category === activeCategory
                );



            let searchMatch =
                productName.includes(search);



            return (
                categoryMatch
                &&
                searchMatch
            );


        });



    /*
    TITLE
    */

    $("#menuTitle").text(

        activeCategory === "All"

            ? "All Products"

            : activeCategory + " Menu"

    );



    /*
    COUNT
    */

    $("#productCount").text(

        list.length + " products"

    );



    /*
    PRODUCT HTML
    */

    let html = "";



    list.forEach(function (product) {


        let productName =
            getProductName(product);


        let productPrice =
            getProductPrice(product);


        let productStock =
            getProductStock(product);


        let image =
            product.image
            ||
            product.imageUrl
            ||
            "🍽️";



        let disabled =
            productStock <= 0;



        html += `

            <div

                class="rounded-2xl bg-white p-3 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">


                <!-- IMAGE -->

                <div

                    class="mb-3 flex h-28 items-center justify-center rounded-xl bg-slate-100 text-6xl">

                    ${image}

                </div>



                <!-- NAME -->

                <h3
                    class="truncate font-bold"
                    title="${productName}">

                    ${productName}

                </h3>



                <!-- CATEGORY / STOCK -->

                <p
                    class="mt-1 text-xs text-slate-400">

                    ${product.category || "No Category"}

                    ·

                    Stock ${productStock}

                </p>



                <!-- PRICE + BUTTON -->

                <div
                    class="mt-3 flex items-center justify-between">


                    <span
                        class="text-lg font-bold">

                        ${money(productPrice)}

                    </span>



                    <button

                        onclick="addToCart(${product.id})"

                        ${
                            disabled
                            ? "disabled"
                            : ""
                        }

                        class="rounded-lg px-4 py-2 text-sm font-semibold text-white
                        ${
                            disabled
                            ? "cursor-not-allowed bg-slate-300"
                            : "bg-blue-600 hover:bg-blue-700"
                        }">


                        ${
                            disabled
                            ? "Out"
                            : "Add"
                        }


                    </button>


                </div>


            </div>

        `;


    });



    /*
    EMPTY
    */

    if (!html) {

        html = `

            <div
                class="col-span-full rounded-2xl bg-white p-10 text-center">

                <div class="mb-2 text-4xl">

                    🔍

                </div>


                <h3
                    class="font-semibold">

                    No products found

                </h3>


                <p
                    class="mt-1 text-sm text-slate-400">

                    Try another search or category.

                </p>

            </div>

        `;

    }



    $("#productGrid").html(
        html
    );

}



/*
=========================================================
ADD TO CART
=========================================================
*/

function addToCart(id) {


    /*
    Find product.

    == is intentional because localStorage
    data can sometimes contain string IDs.
    */

    let product =
        products.find(function (p) {

            return p.id == id;

        });



    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }



    /*
    GET SAFE VALUES
    */

    let productName =
        getProductName(product);


    let productPrice =
        getProductPrice(product);


    let productStock =
        getProductStock(product);


    let productImage =
        product.image
        ||
        product.imageUrl
        ||
        "🍽️";



    /*
    STOCK CHECK
    */

    if (productStock <= 0) {

        alert(
            productName
            +
            " is out of stock."
        );

        return;

    }



    /*
    CHECK EXISTING CART ITEM
    */

    let item =
        cart.find(function (p) {

            return p.id == id;

        });



    if (item) {


        /*
        Quantity limit
        */

        if (
            Number(item.qty)
            >=
            productStock
        ) {

            alert(
                "Not enough stock."
            );

            return;

        }



        item.qty =
            Number(item.qty)
            +
            1;



    } else {


        /*
        ADD NEW ITEM

        IMPORTANT:
        We explicitly use "name"
        here so cart never receives
        undefined.
        */

        cart.push({

            id: product.id,

            name: productName,

            category:
                product.category
                ||
                "",

            price: productPrice,

            stock: productStock,

            image: productImage,

            qty: 1

        });


    }



    renderCart();

}



/*
=========================================================
CHANGE QUANTITY
=========================================================
*/

function changeQty(id, difference) {


    let item =
        cart.find(function (p) {

            return p.id == id;

        });



    if (!item) {

        return;

    }



    let product =
        products.find(function (p) {

            return p.id == id;

        });



    if (!product) {

        return;

    }



    let stock =
        getProductStock(product);



    item.qty =
        Number(item.qty)
        +
        Number(difference);



    /*
    REMOVE
    */

    if (item.qty <= 0) {

        cart =
            cart.filter(function (p) {

                return p.id != id;

            });

    }



    /*
    MAX STOCK
    */

    if (item.qty > stock) {

        item.qty = stock;

        alert(
            "You cannot add more than available stock."
        );

    }



    renderCart();

}



/*
=========================================================
RENDER CART
=========================================================
*/

function renderCart() {


    /*
    CART ITEM COUNT
    */

    let totalQuantity =
        cart.reduce(
            function (sum, item) {

                return (
                    sum
                    +
                    Number(item.qty || 0)
                );

            },
            0
        );



    $("#cartCount").text(

        totalQuantity
        +
        (
            totalQuantity === 1
                ? " item"
                : " items"
        )

    );



    /*
    EMPTY CART
    */

    if (cart.length === 0) {


        $("#cartItems").html(`

            <div
                class="py-12 text-center">

                <div
                    class="mb-3 text-5xl">

                    🛒

                </div>


                <p
                    class="font-semibold text-slate-500">

                    Your invoice is empty

                </p>


                <p
                    class="mt-1 text-xs text-slate-400">

                    Add products to create an order.

                </p>

            </div>

        `);


    } else {


        /*
        CART HTML
        */

        let html = "";



        cart.forEach(function (item) {


            /*
            SAFE PRODUCT NAME

            This prevents undefined.
            */

            let productName =
                item.name
                ||
                item.productName
                ||
                "Unknown Product";



            let price =
                Number(item.price)
                ||
                0;



            let quantity =
                Number(item.qty)
                ||
                0;



            let image =
                item.image
                ||
                "🍽️";



            let lineTotal =
                price * quantity;



            html += `

                <div

                    class="flex gap-3 rounded-xl bg-slate-50 p-3">


                    <!-- IMAGE -->

                    <div

                        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-white text-2xl">

                        ${image}

                    </div>



                    <!-- DETAILS -->

                    <div
                        class="min-w-0 flex-1">


                        <div
                            class="truncate font-semibold"
                            title="${productName}">

                            ${productName}

                        </div>



                        <div
                            class="text-sm text-slate-500">

                            ${money(price)}

                            ×

                            ${quantity}

                        </div>



                        <!-- QUANTITY -->

                        <div
                            class="mt-2 flex items-center gap-2">


                            <button

                                onclick="changeQty(${item.id}, -1)"

                                class="flex h-7 w-7 items-center justify-center rounded-full border bg-white text-slate-700 hover:bg-slate-100">

                                −

                            </button>



                            <span
                                class="w-5 text-center text-sm font-semibold">

                                ${quantity}

                            </span>



                            <button

                                onclick="changeQty(${item.id}, 1)"

                                class="flex h-7 w-7 items-center justify-center rounded-full bg-blue-600 text-white hover:bg-blue-700">

                                +

                            </button>


                        </div>


                    </div>



                    <!-- TOTAL -->

                    <div
                        class="shrink-0 text-right">


                        <div
                            class="font-semibold">

                            ${money(lineTotal)}

                        </div>


                    </div>


                </div>

            `;


        });



        $("#cartItems").html(
            html
        );

    }



    /*
    =====================================================
    CALCULATE TOTAL
    =====================================================
    */

    let subtotal =
        cart.reduce(
            function (sum, item) {


                let price =
                    Number(item.price)
                    ||
                    0;


                let qty =
                    Number(item.qty)
                    ||
                    0;



                return (
                    sum
                    +
                    price * qty
                );


            },
            0
        );



    let tax =
        subtotal * 0.05;



    let total =
        subtotal + tax;



    /*
    DISPLAY
    */

    $("#subtotal").text(
        money(subtotal)
    );


    $("#tax").text(
        money(tax)
    );


    $("#total").text(
        money(total)
    );

}



/*
=========================================================
UPDATE CLOCK
=========================================================
*/

function updateClock() {


    let date =
        new Date();



    $("#clock").text(

        date.toLocaleDateString()
        +
        " "
        +
        date.toLocaleTimeString()

    );

}



/*
=========================================================
DOCUMENT READY
=========================================================
*/

$(document).ready(function () {


    /*
    INITIAL DISPLAY
    */

    renderCategories();

    renderProducts();

    renderCart();

    updateClock();



    /*
    CLOCK
    */

    setInterval(
        updateClock,
        1000
    );



    /*
    =====================================================
    CATEGORY BUTTON
    =====================================================
    */

    $(document).on(
        "click",
        ".cat-btn",
        function () {


            activeCategory =
                $(this).data("cat");


            renderCategories();

            renderProducts();


        }
    );



    /*
    =====================================================
    CATEGORY DROPDOWN
    =====================================================
    */

    $("#categoryFilter").change(
        function () {


            activeCategory =
                $(this).val();


            renderCategories();

            renderProducts();


        }
    );



    /*
    =====================================================
    SEARCH
    =====================================================
    */

    $("#searchProduct").on(
        "input",
        function () {

            renderProducts();

        }
    );



    /*
    =====================================================
    CLEAR CART
    =====================================================
    */

    $("#clearCart").click(
        function () {


            if (cart.length === 0) {

                return;

            }



            if (
                !confirm(
                    "Clear all products from invoice?"
                )
            ) {

                return;

            }



            cart = [];

            renderCart();


        }
    );



    /*
    =====================================================
    PAYMENT BUTTON
    =====================================================
    */

    $(".payment-btn").click(
        function () {


            payment =
                $(this).data("method");



            /*
            Remove selected style
            */

            $(".payment-btn")
                .removeClass(
                    "border-blue-500 bg-blue-50 text-blue-600"
                );



            /*
            Add selected style
            */

            $(this).addClass(
                "border-blue-500 bg-blue-50 text-blue-600"
            );


        }
    );



    /*
    DEFAULT PAYMENT
    */

    $('.payment-btn[data-method="Cash"]')
        .addClass(
            "border-blue-500 bg-blue-50 text-blue-600"
        );



    /*
    =====================================================
    PLACE ORDER
    =====================================================
    */

    $("#placeOrder").click(
        function () {


            /*
            CHECK CART
            */

            if (cart.length === 0) {

                alert(
                    "Please add a product first."
                );

                return;

            }



            /*
            CALCULATE SUBTOTAL
            */

            let subtotal =
                cart.reduce(
                    function (sum, item) {

                        return (
                            sum
                            +
                            Number(item.price || 0)
                            *
                            Number(item.qty || 0)
                        );

                    },
                    0
                );



            let tax =
                subtotal * 0.05;



            let total =
                subtotal + tax;



            /*
            =================================================
            CREATE SALE
            =================================================
            */

            let sale = {


                /*
                Invoice number
                */

                id:
                    "INV-"
                    +
                    Date.now(),



                /*
                Sale date
                */

                date:
                    new Date().toISOString(),



                /*
                Products
                */

                items:

                    cart.map(function (item) {

                        return {

                            id: item.id,

                            name:
                                item.name
                                ||
                                item.productName
                                ||
                                "Unknown Product",

                            qty:
                                Number(item.qty)
                                ||
                                0,

                            price:
                                Number(item.price)
                                ||
                                0

                        };

                    }),



                /*
                Amount
                */

                subtotal:
                    subtotal,


                tax:
                    tax,


                total:
                    total,



                /*
                Payment
                */

                payment:
                    payment

            };



            /*
            =================================================
            GET OLD SALES
            =================================================
            */

            let sales = [];



            try {

                sales =
                    JSON.parse(
                        localStorage.getItem("ks7_sales")
                    )
                    ||
                    [];

            } catch (error) {

                sales = [];

            }



            /*
            =================================================
            ADD NEW SALE
            =================================================
            */

            sales.unshift(
                sale
            );



            /*
            =================================================
            SAVE SALES
            =================================================
            */

            localStorage.setItem(
                "ks7_sales",
                JSON.stringify(sales)
            );



            /*
            =================================================
            UPDATE PRODUCT STOCK
            =================================================
            */

            products =
                products.map(
                    function (product) {


                        let cartItem =
                            cart.find(
                                function (item) {

                                    return (
                                        item.id
                                        ==
                                        product.id
                                    );

                                }
                            );



                        /*
                        If product exists in cart
                        */

                        if (cartItem) {


                            let oldStock =
                                getProductStock(product);


                            let soldQty =
                                Number(
                                    cartItem.qty
                                )
                                ||
                                0;



                            return {

                                ...product,

                                stock:
                                    Math.max(
                                        0,
                                        oldStock
                                        -
                                        soldQty
                                    )

                            };


                        }



                        return product;


                    }
                );



            /*
            =================================================
            SAVE UPDATED PRODUCTS
            =================================================
            */

            localStorage.setItem(
                "ks7_products",
                JSON.stringify(products)
            );



            /*
            =================================================
            SUCCESS
            =================================================
            */

            alert(

                "Order placed successfully!\n\n"
                +
                "Invoice: "
                +
                sale.id
                +
                "\n"
                +
                "Total: "
                +
                money(sale.total)
                +
                "\n"
                +
                "Payment: "
                +
                sale.payment

            );



            /*
            =================================================
            RESET CART
            =================================================
            */

            cart = [];



            /*
            RELOAD DATA
            */

            loadData();



            /*
            REFRESH UI
            */

            renderCategories();

            renderProducts();

            renderCart();


        }
    );


});


</script>


</body>

</html>
