<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS7 POS - Point of Sale</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#3478e5"
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-slate-100 text-slate-800">

    <div class="flex min-h-screen">

        <!-- LEFT NAVIGATION -->
        <aside
            class="fixed left-0 top-0 z-30 flex h-screen w-20 flex-col items-center border-r bg-white py-5 shadow-sm">

            <div class="mb-8 flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 text-xl font-bold text-white">
                K
            </div>

            <nav class="flex flex-col gap-3">

                <a href="index.html"
                    class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 text-white">
                    ▦
                </a>

                <a href="category.html"
                    class="flex h-11 w-11 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-100">
                    ☷
                </a>

                <a href="product.html"
                    class="flex h-11 w-11 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-100">
                    ▤
                </a>

                <a href="sales.html"
                    class="flex h-11 w-11 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-100">
                    ▧
                </a>

                <a href="report.html"
                    class="flex h-11 w-11 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-100">
                    ▥
                </a>

            </nav>

            <div class="mt-auto text-center text-xs text-slate-400">
                KS7<br>POS
            </div>

        </aside>

        <!-- MAIN -->
        <main class="ml-20 flex min-h-screen flex-1 flex-col">

            <!-- HEADER -->
            <header class="flex h-20 items-center justify-between border-b bg-white px-7">

                <div>
                    <h1 class="text-xl font-bold">
                        Point of Sale
                    </h1>

                    <p class="text-sm text-slate-400">
                        Create a new sales order
                    </p>
                </div>

                <div class="flex items-center gap-4">

                    <span id="clock"
                        class="hidden text-sm text-slate-500 md:block">
                    </span>

                    <div
                        class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 font-bold text-blue-600">
                        KS
                    </div>

                    <div class="hidden md:block">
                        <p class="text-sm font-semibold">
                            Cashier
                        </p>

                        <p class="text-xs text-slate-400">
                            Cashier Shift
                        </p>
                    </div>

                </div>

            </header>


            <!-- POS CONTENT -->
            <section
                class="grid flex-1 grid-cols-1 gap-5 p-5 xl:grid-cols-[1fr_350px]">

                <div>

                    <!-- SEARCH -->
                    <div class="mb-4 flex flex-col gap-3 md:flex-row">

                        <div class="relative flex-1">

                            <span
                                class="absolute left-4 top-3 text-slate-400">
                                ⌕
                            </span>

                            <input
                                id="searchProduct"
                                type="text"
                                placeholder="Search product..."
                                class="w-full rounded-xl border-0 bg-white py-3 pl-11 pr-4 shadow-sm outline-none focus:ring-2 focus:ring-blue-500">

                        </div>

                        <select
                            id="categoryFilter"
                            class="rounded-xl border-0 bg-white px-4 py-3 shadow-sm outline-none">
                        </select>

                    </div>


                    <!-- CATEGORY -->
                    <div
                        id="categoryButtons"
                        class="mb-5 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
                    </div>


                    <div class="mb-3 flex items-center justify-between">

                        <h2
                            id="menuTitle"
                            class="text-lg font-bold">
                            All Products
                        </h2>

                        <span
                            id="productCount"
                            class="text-sm text-slate-400">
                        </span>

                    </div>


                    <!-- PRODUCTS -->
                    <div
                        id="productGrid"
                        class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
                    </div>

                </div>


                <!-- INVOICE -->
                <aside
                    class="rounded-2xl bg-white p-5 shadow-sm xl:sticky xl:top-5 xl:h-[calc(100vh-120px)]">

                    <div
                        class="flex items-center justify-between border-b pb-4">

                        <h2 class="text-xl font-bold">
                            Invoice
                        </h2>

                        <button
                            id="clearCart"
                            class="text-sm font-medium text-red-500">
                            Clear
                        </button>

                    </div>


                    <div
                        id="cartItems"
                        class="max-h-[360px] space-y-3 overflow-auto py-4">
                    </div>


                    <!-- SUMMARY -->
                    <div class="border-t pt-4">

                        <div
                            class="flex justify-between py-1 text-sm text-slate-500">

                            <span>Sub Total</span>

                            <b id="subtotal">
                                $0.00
                            </b>

                        </div>

                        <div
                            class="flex justify-between py-1 text-sm text-slate-500">

                            <span>Tax (5%)</span>

                            <b id="tax">
                                $0.00
                            </b>

                        </div>

                        <div
                            class="mt-2 flex justify-between border-t pt-3 text-lg font-bold">

                            <span>Total</span>

                            <b
                                id="total"
                                class="text-blue-600">
                                $0.00
                            </b>

                        </div>

                    </div>


                    <!-- PAYMENT -->
                    <div class="mt-5 grid grid-cols-3 gap-2">

                        <button
                            class="payment-btn rounded-lg border p-3 text-xs font-semibold hover:bg-blue-50"
                            data-method="Cash">

                            💵
                            <br>
                            Cash

                        </button>

                        <button
                            class="payment-btn rounded-lg border p-3 text-xs font-semibold hover:bg-blue-50"
                            data-method="Card">

                            💳
                            <br>
                            Card

                        </button>

                        <button
                            class="payment-btn rounded-lg border p-3 text-xs font-semibold hover:bg-blue-50"
                            data-method="Mobile">

                            📱
                            <br>
                            Mobile

                        </button>

                    </div>


                    <button
                        id="placeOrder"
                        class="mt-4 w-full rounded-xl bg-blue-600 py-3.5 font-semibold text-white shadow hover:bg-blue-700">

                        Place An Order

                    </button>

                </aside>

            </section>

        </main>

    </div>


<script>

const defaultCategories = [

    {
        id: 1,
        name: "Breakfast",
        icon: "🍳"
    },

    {
        id: 2,
        name: "Lunch",
        icon: "🍱"
    },

    {
        id: 3,
        name: "Dinner",
        icon: "🍽️"
    },

    {
        id: 4,
        name: "Soup",
        icon: "🍲"
    },

    {
        id: 5,
        name: "Desserts",
        icon: "🍰"
    },

    {
        id: 6,
        name: "Side Dish",
        icon: "🥗"
    },

    {
        id: 7,
        name: "Appetizer",
        icon: "🥟"
    },

    {
        id: 8,
        name: "Beverages",
        icon: "🥤"
    }

];


const defaultProducts = [

    {
        id: 1,
        name: "Pasta Bolognese",
        category: "Lunch",
        price: 50.5,
        stock: 20,
        image: "🍝"
    },

    {
        id: 2,
        name: "Spicy Fried Chicken",
        category: "Lunch",
        price: 45.7,
        stock: 15,
        image: "🍗"
    },

    {
        id: 3,
        name: "Grilled Steak",
        category: "Dinner",
        price: 80,
        stock: 10,
        image: "🥩"
    },

    {
        id: 4,
        name: "Fish And Chips",
        category: "Lunch",
        price: 90.4,
        stock: 12,
        image: "🍟"
    },

    {
        id: 5,
        name: "Beef Bourguignon",
        category: "Dinner",
        price: 75.5,
        stock: 8,
        image: "🍲"
    },

    {
        id: 6,
        name: "Spaghetti Carbonara",
        category: "Lunch",
        price: 35.3,
        stock: 16,
        image: "🍝"
    },

    {
        id: 7,
        name: "Ratatouille",
        category: "Dinner",
        price: 26.7,
        stock: 10,
        image: "🥘"
    },

    {
        id: 8,
        name: "Kimchi Jjigae",
        category: "Soup",
        price: 45.7,
        stock: 14,
        image: "🍲"
    },

    {
        id: 9,
        name: "Tofu Scramble",
        category: "Breakfast",
        price: 85.6,
        stock: 9,
        image: "🥗"
    },

    {
        id: 10,
        name: "Chocolate Cake",
        category: "Desserts",
        price: 30,
        stock: 20,
        image: "🍰"
    },

    {
        id: 11,
        name: "Fresh Orange Juice",
        category: "Beverages",
        price: 18,
        stock: 25,
        image: "🍊"
    },

    {
        id: 12,
        name: "French Fries",
        category: "Side Dish",
        price: 15,
        stock: 30,
        image: "🍟"
    }

];


if (!localStorage.getItem("ks7_categories")) {

    localStorage.setItem(
        "ks7_categories",
        JSON.stringify(defaultCategories)
    );

}


if (!localStorage.getItem("ks7_products")) {

    localStorage.setItem(
        "ks7_products",
        JSON.stringify(defaultProducts)
    );

}


let products =
    JSON.parse(localStorage.getItem("ks7_products"));

let categories =
    JSON.parse(localStorage.getItem("ks7_categories"));

let cart = [];

let activeCategory = "All";

let payment = "Cash";


function money(number) {

    return "$" + Number(number).toFixed(2);

}


function renderCategories() {

    $("#categoryFilter").html(
        `<option value="All">
            All Categories
        </option>` +

        categories.map(function (category) {

            return `
                <option value="${category.name}">
                    ${category.name}
                </option>
            `;

        }).join("")
    );


    $("#categoryButtons").html(`

        <button
            data-cat="All"
            class="cat-btn rounded-xl border bg-blue-600 p-3 text-left text-white shadow">

            <span class="text-2xl">
                ▦
            </span>

            <div class="font-semibold">
                All Menu
            </div>

            <div class="text-xs opacity-80">
                ${products.length} items
            </div>

        </button>

    ` +

        categories.map(function (category) {

            return `

                <button
                    data-cat="${category.name}"
                    class="cat-btn rounded-xl border bg-white p-3 text-left hover:border-blue-500">

                    <span class="text-2xl">
                        ${category.icon}
                    </span>

                    <div class="font-semibold">
                        ${category.name}
                    </div>

                    <div class="text-xs text-slate-400">
                        ${products.filter(function (p) {
                            return p.category === category.name;
                        }).length}
                        items
                    </div>

                </button>

            `;

        }).join("")

    );

}


function renderProducts() {

    let search =
        $("#searchProduct").val().toLowerCase();

    let list = products.filter(function (product) {

        return (

            (activeCategory === "All" ||
                product.category === activeCategory)

            &&

            product.name.toLowerCase().includes(search)

        );

    });


    $("#menuTitle").text(
        activeCategory === "All"
            ? "All Products"
            : activeCategory + " Menu"
    );


    $("#productCount").text(
        list.length + " products"
    );


    $("#productGrid").html(

        list.map(function (product) {

            return `

                <div
                    class="rounded-2xl bg-white p-3 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">

                    <div
                        class="mb-3 flex h-28 items-center justify-center rounded-xl bg-slate-100 text-6xl">

                        ${product.image}

                    </div>

                    <h3 class="font-bold">
                        ${product.name}
                    </h3>

                    <p class="mt-1 text-xs text-slate-400">
                        ${product.category}
                        · Stock ${product.stock}
                    </p>

                    <div
                        class="mt-3 flex items-center justify-between">

                        <span class="text-lg font-bold">
                            ${money(product.price)}
                        </span>

                        <button
                            onclick="addToCart(${product.id})"
                            class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">

                            Add

                        </button>

                    </div>

                </div>

            `;

        }).join("")

        ||

        `

        <div
            class="col-span-full rounded-xl bg-white p-10 text-center text-slate-400">

            No products found.

        </div>

        `

    );

}


function addToCart(id) {

    let product =
        products.find(function (p) {
            return p.id === id;
        });


    if (!product || product.stock <= 0) {

        alert("Product is out of stock.");

        return;

    }


    let item =
        cart.find(function (p) {
            return p.id === id;
        });


    if (item) {

        if (item.qty >= product.stock) {

            alert("Not enough stock.");

            return;

        }

        item.qty++;

    } else {

        cart.push({
            ...product,
            qty: 1
        });

    }


    renderCart();

}


function changeQty(id, difference) {

    let item =
        cart.find(function (p) {
            return p.id === id;
        });


    let product =
        products.find(function (p) {
            return p.id === id;
        });


    if (!item) return;


    item.qty += difference;


    if (item.qty <= 0) {

        cart =
            cart.filter(function (p) {
                return p.id !== id;
            });

    }


    if (item.qty > product.stock) {

        item.qty = product.stock;

    }


    renderCart();

}


function renderCart() {

    $("#cartItems").html(

        cart.map(function (item) {

            return `

                <div
                    class="flex gap-3 rounded-xl bg-slate-50 p-3">

                    <div
                        class="flex h-12 w-12 items-center justify-center rounded-lg bg-white text-2xl">

                        ${item.image}

                    </div>

                    <div class="min-w-0 flex-1">

                        <div class="truncate font-semibold">
                            ${item.name}
                        </div>

                        <div class="text-sm text-slate-500">
                            ${money(item.price)} × ${item.qty}
                        </div>

                        <div class="mt-2 flex items-center gap-2">

                            <button
                                onclick="changeQty(${item.id}, -1)"
                                class="h-7 w-7 rounded-full border bg-white">

                                −

                            </button>

                            <span class="w-4 text-center text-sm">
                                ${item.qty}
                            </span>

                            <button
                                onclick="changeQty(${item.id}, 1)"
                                class="h-7 w-7 rounded-full bg-blue-600 text-white">

                                +

                            </button>

                        </div>

                    </div>

                    <b>
                        ${money(item.price * item.qty)}
                    </b>

                </div>

            `;

        }).join("")

        ||

        `

        <div class="py-12 text-center text-sm text-slate-400">

            Your invoice is empty.

        </div>

        `

    );


    let subtotal =
        cart.reduce(function (sum, item) {

            return sum + item.price * item.qty;

        }, 0);


    let tax = subtotal * 0.05;


    $("#subtotal").text(money(subtotal));

    $("#tax").text(money(tax));

    $("#total").text(money(subtotal + tax));

}


function updateClock() {

    let date = new Date();

    $("#clock").text(
        date.toLocaleDateString()
        + " "
        + date.toLocaleTimeString()
    );

}


$(document).ready(function () {

    renderCategories();

    renderProducts();

    renderCart();

    updateClock();

    setInterval(updateClock, 1000);


    $(document).on(
        "click",
        ".cat-btn",
        function () {

            activeCategory =
                $(this).data("cat");

            $("#categoryFilter")
                .val(activeCategory);

            renderCategories();

            renderProducts();

        }
    );


    $("#categoryFilter").change(function () {

        activeCategory = $(this).val();

        renderCategories();

        renderProducts();

    });


    $("#searchProduct").on(
        "input",
        function () {

            renderProducts();

        }
    );


    $("#clearCart").click(function () {

        cart = [];

        renderCart();

    });


    $(".payment-btn").click(function () {

        payment =
            $(this).data("method");

        $(".payment-btn")
            .removeClass(
                "border-blue-500 bg-blue-50"
            );

        $(this).addClass(
            "border-blue-500 bg-blue-50"
        );

    });


    $("#placeOrder").click(function () {

        if (cart.length === 0) {

            alert(
                "Please add a product first."
            );

            return;

        }


        let subtotal =
            cart.reduce(function (sum, item) {

                return sum + item.price * item.qty;

            }, 0);


        let sale = {

            id: "INV-" + Date.now(),

            date:
                new Date().toISOString(),

            items:
                cart.map(function (item) {

                    return {

                        id: item.id,

                        name: item.name,

                        qty: item.qty,

                        price: item.price

                    };

                }),

            subtotal: subtotal,

            tax: subtotal * 0.05,

            total: subtotal * 1.05,

            payment: payment

        };


        let sales =
            JSON.parse(
                localStorage.getItem("ks7_sales") || "[]"
            );


        sales.unshift(sale);


        localStorage.setItem(
            "ks7_sales",
            JSON.stringify(sales)
        );


        products =
            products.map(function (product) {

                let item =
                    cart.find(function (x) {
                        return x.id === product.id;
                    });


                if (item) {

                    return {

                        ...product,

                        stock:
                            product.stock - item.qty

                    };

                }


                return product;

            });


        localStorage.setItem(
            "ks7_products",
            JSON.stringify(products)
        );


        alert(
            "Order placed successfully: "
            + sale.id
        );


        cart = [];

        renderCategories();

        renderProducts();

        renderCart();

    });

});

</script>

</body>
</html>
