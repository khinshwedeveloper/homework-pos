```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KS7 Mini POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

</head>

<body class="bg-light">

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark mb-4">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                KS7 MINI POS
            </a>

        </div>

    </nav>


    <div class="container">

        <div class="row">

            <!-- Product Form -->

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-header bg-primary text-white">

                        <h5 class="mb-0">
                            Product
                        </h5>

                    </div>

                    <div class="card-body">

                        <input type="hidden" id="productId">

                        <div class="mb-3">

                            <label for="productName"
                                class="form-label">
                                Product Name
                            </label>

                            <input type="text"
                                class="form-control"
                                id="productName"
                                placeholder="Enter product name">

                        </div>


                        <div class="mb-3">

                            <label for="productCategory"
                                class="form-label">
                                Category
                            </label>

                            <select class="form-select"
                                id="productCategory">

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Drink">
                                    Drink
                                </option>

                                <option value="Medicine">
                                    Medicine
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label for="productPrice"
                                class="form-label">
                                Price
                            </label>

                            <input type="number"
                                class="form-control"
                                id="productPrice"
                                placeholder="Enter price">

                        </div>


                        <div class="mb-3">

                            <label for="productStock"
                                class="form-label">
                                Stock
                            </label>

                            <input type="number"
                                class="form-control"
                                id="productStock"
                                placeholder="Enter stock">

                        </div>


                        <button type="button"
                            class="btn btn-success"
                            id="btnSave">

                            Save Product

                        </button>


                        <button type="button"
                            class="btn btn-secondary"
                            id="btnClear">

                            Clear

                        </button>

                    </div>

                </div>

            </div>


            <!-- Product List -->

            <div class="col-md-8">

                <div class="card shadow-sm">

                    <div class="card-header">

                        <div class="row align-items-center">

                            <div class="col-md-6">

                                <h5 class="mb-0">
                                    Product List
                                </h5>

                            </div>

                            <div class="col-md-6">

                                <input type="text"
                                    class="form-control"
                                    id="searchProduct"
                                    placeholder="Search product...">

                            </div>

                        </div>

                    </div>


                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-bordered table-hover">

                                <thead class="table-dark">

                                    <tr>

                                        <th>
                                            Actions
                                        </th>

                                        <th>
                                            No.
                                        </th>

                                        <th>
                                            Product
                                        </th>

                                        <th>
                                            Category
                                        </th>

                                        <th>
                                            Price
                                        </th>

                                        <th>
                                            Stock
                                        </th>

                                    </tr>

                                </thead>


                                <tbody id="tableData">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>


    <!-- jQuery -->

    <script src="https://code.jquery.com/jquery-4.0.0.min.js">
    </script>


    <script>

        // ==========================================
        // IndexedDB
        // ==========================================

        let db;

        let _editId = null;


        let request = indexedDB.open("KS7POS", 1);


        request.onupgradeneeded = function (event) {

            db = event.target.result;

            let objectStore = db.createObjectStore("products", {
                keyPath: "id"
            });

        };


        request.onsuccess = function (event) {

            db = event.target.result;

            loadProducts();

        };


        request.onerror = function (event) {

            console.log("Database error:", event.target.error);

        };


        // ==========================================
        // Save Button
        // ==========================================

        $('#btnSave').click(function () {

            if (_editId == null) {

                saveProduct();

            }
            else {

                updateProduct();

                _editId = null;

            }

        });


        // ==========================================
        // Save Product
        // ==========================================

        function saveProduct() {

            let _name = $('#productName').val();
            let _category = $('#productCategory').val();
            let _price = $('#productPrice').val();
            let _stock = $('#productStock').val();


            if (_name == "" ||
                _category == "" ||
                _price == "" ||
                _stock == "") {

                alert("Please fill all fields.");

                return;

            }


            let product = {

                id: crypto.randomUUID(),

                name: _name,

                category: _category,

                price: Number(_price),

                stock: Number(_stock)

            };


            let transaction =
                db.transaction(["products"], "readwrite");


            let objectStore =
                transaction.objectStore("products");


            objectStore.add(product);


            transaction.oncomplete = function () {

                alert("Product saved successfully.");

                clearForm();

                loadProducts();

            };


            transaction.onerror = function (event) {

                console.log(
                    "Save error:",
                    event.target.error
                );

            };

        }


        // ==========================================
        // Load Products
        // ==========================================

        function loadProducts() {

            $('#tableData').html('');


            let transaction =
                db.transaction(["products"], "readonly");


            let objectStore =
                transaction.objectStore("products");


            let request =
                objectStore.getAll();


            request.onsuccess = function () {

                let products = request.result;


                for (let i = 0;
                    i < products.length;
                    i++) {

                    const product = products[i];


                    let trRow = `

                        <tr>

                            <td>

                                <button
                                    type="button"
                                    class="btn btn-sm btn-warning"
                                    onclick="editProduct('${product.id}')">

                                    Edit

                                </button>


                                <button
                                    type="button"
                                    class="btn btn-sm btn-danger"
                                    onclick="deleteProduct('${product.id}')">

                                    Delete

                                </button>

                            </td>


                            <th scope="row">
                                ${i + 1}
                            </th>


                            <td>
                                ${product.name}
                            </td>


                            <td>
                                ${product.category}
                            </td>


                            <td>
                                ${product.price.toFixed(2)}
                            </td>


                            <td>
                                ${product.stock}
                            </td>

                        </tr>

                    `;


                    $('#tableData').append(trRow);

                }

            };

        }


        // ==========================================
        // Edit Product
        // ==========================================

        function editProduct(id) {

            let transaction =
                db.transaction(["products"], "readonly");


            let objectStore =
                transaction.objectStore("products");


            let request =
                objectStore.get(id);


            request.onsuccess = function () {

                let product = request.result;


                if (!product) {

                    alert("No data found.");

                    return;

                }


                $('#productName').val(product.name);

                $('#productCategory')
                    .val(product.category);

                $('#productPrice')
                    .val(product.price);

                $('#productStock')
                    .val(product.stock);


                _editId = product.id;


                $('#btnSave')
                    .text("Update Product")
                    .removeClass("btn-success")
                    .addClass("btn-primary");

            };

        }


        // ==========================================
        // Update Product
        // ==========================================

        function updateProduct() {

            let _name = $('#productName').val();

            let _category =
                $('#productCategory').val();

            let _price =
                $('#productPrice').val();

            let _stock =
                $('#productStock').val();


            if (_name == "" ||
                _category == "" ||
                _price == "" ||
                _stock == "") {

                alert("Please fill all fields.");

                return;

            }


            let product = {

                id: _editId,

                name: _name,

                category: _category,

                price: Number(_price),

                stock: Number(_stock)

            };


            let transaction =
                db.transaction(["products"], "readwrite");


            let objectStore =
                transaction.objectStore("products");


            objectStore.put(product);


            transaction.oncomplete = function () {

                alert("Product updated successfully.");

                clearForm();

                loadProducts();

            };

        }


        // ==========================================
        // Delete Product
        // ==========================================

        function deleteProduct(id) {

            let confirmation =
                confirm("Are you sure you want to delete?");


            if (!confirmation) {

                return;

            }


            let transaction =
                db.transaction(["products"], "readwrite");


            let objectStore =
                transaction.objectStore("products");


            objectStore.delete(id);


            transaction.oncomplete = function () {

                alert("Product deleted successfully.");

                loadProducts();

            };

        }


        // ==========================================
        // Clear Form
        // ==========================================

        function clearForm() {

            $('#productName').val('');

            $('#productCategory').val('');

            $('#productPrice').val('');

            $('#productStock').val('');

            _editId = null;


            $('#btnSave')
                .text("Save Product")
                .removeClass("btn-primary")
                .addClass("btn-success");

        }


        $('#btnClear').click(function () {

            clearForm();

        });


        // ==========================================
        // Search Product
        // ==========================================

        $('#searchProduct').keyup(function () {

            let searchText =
                $(this).val().toLowerCase();


            $('#tableData tr').each(function () {

                let rowText =
                    $(this).text().toLowerCase();


                if (rowText.includes(searchText)) {

                    $(this).show();

                }
                else {

                    $(this).hide();

                }

            });

        });

    </script>

</body>

</html>
```
